name: pages

# A ogni push su main: test unitari, build e pubblicazione su GitHub Pages (SPEC §6.11).
# L'app pubblicata non contiene token né dati: mostra la schermata di accesso.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test unitari
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_PUBLIC_SITE: 'true' # senza token si vede solo l'accesso, non la demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
